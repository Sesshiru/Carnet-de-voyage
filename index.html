<style>
:root{
  --papier:#F7F2E6;
  --papier-bord:#E7DECB;
  --grille:#F4F8FB;
  --grille-ligne:rgba(120,158,188,.13);
  --grille-bord:#E4EDF4;
  --encre:#453F37;
  --encre-pale:#948D80;
  --sumi:#B4534A;
  --etoile:#9FB264;
  --bleu:#5B7C99;
  --surligne-lav:#E6DDF5;
  --surligne-blu:#D9EAF7;
  --surligne-jau:#F6EEC6;
  --fond:#D8D1C3;
  --r:14px;
  --ombre:0 18px 40px -18px rgba(58,55,51,.35), 0 2px 6px rgba(58,55,51,.06);
  --f-disp:'Quicksand', ui-rounded, system-ui, sans-serif;
  --f-main:'Patrick Hand', 'Quicksand', ui-rounded, system-ui, sans-serif;
  --f-hand:'Caveat', cursive;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--f-main);color:var(--encre);
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.30), rgba(255,255,255,0) 62%),
    var(--fond);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  padding:calc(18px + env(safe-area-inset-top)) 14px 100px;
  min-height:100vh;
  -webkit-text-size-adjust:100%;
  font-synthesis-weight:none;
}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;border-radius:0}

/* ---------- carnet ---------- */
.carnet{
  max-width:1180px;margin:0 auto;position:relative;
  display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:stretch;
  grid-auto-rows:1fr;
  height:calc(100vh - 136px);height:calc(100dvh - 136px);min-height:460px;
  padding-right:66px;
}
.page{
  border-radius:var(--r);box-shadow:var(--ombre);position:relative;padding:0;
  height:calc(100vh - 136px);height:calc(100dvh - 136px);min-height:460px;
  align-self:stretch;
}
.carnet>.page{height:100%}
.feuille{
  height:100%;overflow-y:auto;overflow-x:hidden;position:relative;
  padding:26px 24px 34px;border-radius:inherit;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:rgba(69,63,55,.22) transparent;
}
.feuille::-webkit-scrollbar{width:7px}
.feuille::-webkit-scrollbar-thumb{background:rgba(69,63,55,.2);border-radius:99px}
.feuille::-webkit-scrollbar-track{background:transparent}
.page-g{background:var(--papier);border:1px solid var(--papier-bord);overflow:hidden}
.page-d{
  overflow:visible;
  background:
    repeating-linear-gradient(to right, transparent 0 25px, var(--grille-ligne) 25px 26px),
    repeating-linear-gradient(to bottom, transparent 0 25px, var(--grille-ligne) 25px 26px),
    var(--grille);
  border:1px solid var(--grille-bord);
}
.onglets{position:absolute;top:34px;right:-66px;display:flex;flex-direction:column;gap:8px;z-index:5}
.onglet{
  width:78px;padding:9px 8px 9px 12px;border:none;border-radius:0 10px 10px 0;
  background:#E7EDF3;color:var(--encre-pale);text-align:left;
  font-family:var(--f-disp);font-weight:500;font-size:11px;letter-spacing:.06em;line-height:1.15;
  box-shadow:2px 2px 5px rgba(58,55,51,.10);
  transition:transform .16s ease, background .16s ease, color .16s ease;
}
.onglet b{display:block;font-size:16px;font-weight:500;letter-spacing:0}
.onglet:hover{transform:translateX(3px)}
.onglet.on{background:var(--papier);color:var(--encre);transform:translateX(6px)}
.onglet:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}

.tete{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.tete h1{font-family:var(--f-disp);font-weight:500;font-size:30px;margin:0;letter-spacing:.01em}
.meta{font-family:var(--f-disp);font-weight:500;font-size:11.5px;letter-spacing:.2em;color:var(--encre-pale);text-transform:uppercase}
.regle{height:1px;background:repeating-linear-gradient(to right,var(--papier-bord) 0 5px,transparent 5px 9px);margin:16px 0 18px}
.regle-b{background:repeating-linear-gradient(to right,#DCE6EE 0 5px,transparent 5px 9px)}
h2.titre{font-family:var(--f-disp);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--encre-pale);margin:0 0 12px}
h3.sous{font-family:var(--f-disp);font-weight:600;font-size:17px;margin:22px 0 10px}
h3.sous:first-child{margin-top:0}

/* barre de retour (mobile) */
.retour{
  display:none;align-items:center;gap:8px;width:100%;
  border:none;background:transparent;padding:0 0 12px;margin:-4px 0 10px;
  border-bottom:1px dashed #DCE6EE;font-family:var(--f-disp);font-weight:500;font-size:14px;color:var(--encre-pale);text-align:left;
}
.retour b{font-weight:400;font-size:17px;color:var(--encre)}

/* tampon */
.hanko{width:150px;height:150px;margin:6px auto 2px;position:relative;display:grid;place-items:center;transform:rotate(-4deg)}
.hanko::before{content:"";position:absolute;inset:0;border-radius:50%;border:5px solid var(--sumi);opacity:.9}
.hanko::after{content:"";position:absolute;inset:9px;border-radius:50%;border:1.5px solid var(--sumi);opacity:.32}
.hanko-in{text-align:center;color:var(--sumi);line-height:1}
.hanko-in .jp{font-family:var(--f-hand);font-size:20px;opacity:.85}
.hanko-in .n{font-family:var(--f-disp);font-size:58px;font-weight:400;display:block;margin:2px 0 4px;letter-spacing:-.02em}
.hanko-in .lbl{font-family:var(--f-disp);font-weight:500;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.85}

/* écriture */
.champ{width:100%;background:transparent;border:none;border-bottom:1px solid var(--papier-bord);padding:6px 2px;font-size:18.5px;transition:border-color .15s;-webkit-appearance:none;appearance:none}
.page-d .champ{border-bottom-color:#D3E0EA}
.champ:focus{outline:none;border-bottom-color:var(--bleu);background:rgba(255,255,255,.45)}
.champ::placeholder{color:#B9B2A3}
textarea.champ{resize:vertical;min-height:74px;line-height:1.55;border:1px dashed var(--papier-bord);border-radius:10px;padding:10px}
.page-d textarea.champ{border-color:#D9E4EC}
input[type=date].champ,input[type=time].champ{min-height:32px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 14px}
.lbl{display:block;font-family:var(--f-disp);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--encre-pale);margin-bottom:1px}

.coche{display:flex;align-items:flex-start;gap:10px;padding:5px 0}
.case{position:relative;width:17px;height:17px;flex:none;margin-top:3px;border:1.6px solid var(--encre);border-radius:3px;background:transparent;padding:0;display:grid;place-items:center;transition:background .12s}
.case::after{content:"";position:absolute;inset:-13px}
.case svg{width:11px;height:11px;opacity:0;stroke:var(--papier);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.case[aria-checked="true"]{background:var(--encre)}
.case[aria-checked="true"] svg{opacity:1}
.case:focus-visible{outline:2px solid var(--bleu);outline-offset:3px}
.coche .txt{flex:1;background:transparent;border:none;padding:2px 0;font-size:18.5px;min-width:0}
.coche .txt:focus{outline:none;border-bottom:1px solid var(--bleu)}
.coche.fait .txt{color:var(--encre-pale);text-decoration:line-through;text-decoration-thickness:1px}

.jour{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:12px 6px 12px 2px;border-radius:10px;border:none;border-bottom:1px dashed var(--papier-bord);width:100%;background:transparent;text-align:left}
.jour:last-of-type{border-bottom:none}
.jour .num{font-family:var(--f-disp);font-size:34px;font-weight:300;line-height:1;text-align:center}
.jour .dow{display:block;font-family:var(--f-disp);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--encre-pale);margin-top:4px}
.jour .apercu{font-size:16px;color:var(--encre-pale);line-height:1.55;padding-top:4px}
.jour .apercu b{font-weight:400;color:var(--encre);display:block;font-size:17.5px;margin-bottom:2px}
.jour.on{background:#fff;box-shadow:inset 0 0 0 1px var(--papier-bord)}
.jour.on .num,.jour.we .num{color:var(--sumi)}
.jour.auj{background:rgba(91,124,153,.07)}
.jour.auj .num{color:var(--bleu)}
.jour .auj-lbl{display:inline-block;font-family:var(--f-disp);font-weight:500;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--bleu);border:1px solid #C2D3E1;border-radius:99px;padding:1px 6px;margin-top:4px}
.jour .pastille{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--etoile);margin-right:5px;vertical-align:2px}

.carte{width:100%;text-align:left;background:#fff;border:1px solid var(--papier-bord);border-radius:12px;padding:12px 14px;margin-bottom:9px;transition:transform .14s, box-shadow .14s}
.carte:hover{transform:translateY(-1px);box-shadow:0 6px 14px -8px rgba(58,55,51,.4)}
.carte.on{border-color:var(--bleu);box-shadow:inset 3px 0 0 var(--bleu)}
.carte .nom{font-size:19px}
.carte .det{font-family:var(--f-disp);font-size:12.5px;color:var(--encre-pale);margin-top:3px}

.surl{background:linear-gradient(to bottom,transparent 12%,var(--surligne-lav) 12% 92%,transparent 92%);padding:0 4px;border-radius:2px}
.surl-b{background:linear-gradient(to bottom,transparent 12%,var(--surligne-blu) 12% 92%,transparent 92%)}
.main{font-family:var(--f-hand);font-size:24px;color:var(--bleu);line-height:1.3}
.etoile{position:absolute;width:52px;height:52px;opacity:.9;pointer-events:none}

.btn{font-family:var(--f-disp);font-weight:500;border:1px dashed var(--encre-pale);background:transparent;border-radius:999px;padding:8px 16px;font-size:14px;color:var(--encre-pale);transition:all .15s}
.btn:hover{border-style:solid;color:var(--encre);border-color:var(--encre)}
.btn:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
.btn-p{border-style:solid;border-color:var(--encre);color:var(--encre)}
.btn-b{border-style:solid;border-color:var(--bleu);color:var(--bleu)}
.sup{position:relative;border:none;background:transparent;color:#C6BFB0;font-size:18px;line-height:1;padding:2px 5px;border-radius:6px}
.sup::after{content:"";position:absolute;inset:-12px -10px}
.sup:hover{color:var(--sumi);background:rgba(180,83,74,.09)}
.rang{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.rang-suite{display:none}

.somme{display:flex;align-items:baseline;gap:10px;margin:4px 0 2px}
.somme .gros{font-family:var(--f-disp);font-size:44px;font-weight:400}
.somme .eur{font-family:var(--f-disp);font-size:17px;color:var(--encre-pale)}
.barre{height:8px;border-radius:999px;background:#E4DDCB;overflow:hidden;margin:10px 0 4px}
.barre span{display:block;height:100%;background:var(--etoile);border-radius:999px;transition:width .3s}
.ligne-dep{display:grid;grid-template-columns:1fr 92px 30px;gap:8px;align-items:center;padding:3px 0}
.ligne-dep input{background:transparent;border:none;border-bottom:1px solid #D3E0EA;padding:5px 2px;font-size:18px;width:100%}
.ligne-dep input:focus{outline:none;border-bottom-color:var(--bleu)}
.ligne-dep .yen{text-align:right}
.mini{font-family:var(--f-disp);font-size:13px;color:var(--encre-pale)}
.pot{display:flex;justify-content:space-between;font-size:16.5px;padding:7px 0;border-bottom:1px dotted #E0E9F0}
.pot:last-child{border-bottom:none}

.bloc{background:rgba(255,255,255,.7);border:1px solid var(--papier-bord);border-radius:12px;padding:13px 15px;margin-bottom:11px}
.bloc-r{border-color:#E3C6C2;background:rgba(180,83,74,.05)}
.bloc h4{margin:0 0 7px;font-family:var(--f-disp);font-weight:600;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--encre-pale);display:flex;justify-content:space-between;align-items:center;gap:10px}
.bloc-r h4{color:var(--sumi)}
.bloc p{margin:0 0 7px;font-size:17.5px;line-height:1.7}
.bloc p:last-child{margin-bottom:0}
.crayon{font-family:var(--f-disp);font-weight:500;border:none;background:transparent;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--bleu);padding:4px 2px}
.jp-mot{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:17px;line-height:1.8}
.jp-mot i{font-style:normal;color:var(--encre-pale)}

.vide{color:var(--encre-pale);font-size:17px;line-height:1.6;padding:18px 0}
.vide b{display:block;color:var(--encre);font-weight:400;margin-bottom:3px}
.outils{max-width:1180px;margin:16px auto 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.barre-bas{display:none}

/* ---------- couverture ---------- */
.couv{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:calc(26px + env(safe-area-inset-top)) 20px 26px;overflow:auto}
body.ouvert .couv{display:none}
body:not(.ouvert) .carnet,
body:not(.ouvert) .outils,
body:not(.ouvert) .barre-bas{display:none}
.livre{
  position:relative;width:min(356px,84vw);aspect-ratio:3/4.15;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 26px;text-align:center;
  background:linear-gradient(155deg,#F8F3E8 0%,#F2EBDA 55%,#EAE1CD 100%);
  border:none;border-radius:5px 15px 15px 5px;
  box-shadow:0 34px 62px -26px rgba(58,55,51,.6),0 3px 10px rgba(58,55,51,.12),inset 0 0 0 1px rgba(58,55,51,.06);
  transition:transform .3s cubic-bezier(.2,.7,.3,1);
  animation:poser .5s cubic-bezier(.2,.7,.3,1) both;
}
.livre:hover{transform:translateY(-5px) rotate(-.5deg)}
.livre:active{transform:translateY(-1px) scale(.995)}
.livre:focus-visible{outline:2px solid var(--sumi);outline-offset:6px}
.livre::before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;border-radius:5px 0 0 5px;background:linear-gradient(90deg,#DCD2B9 0%,#EDE5D2 65%,rgba(0,0,0,0) 100%);box-shadow:inset -1px 0 0 rgba(58,55,51,.07)}
.livre::after{content:"";position:absolute;right:-5px;top:10px;bottom:10px;width:5px;border-radius:0 4px 4px 0;background:repeating-linear-gradient(to right,#F1ECDE 0 1px,#DBD3BE 1px 2px)}
.elastique{position:absolute;top:-7px;bottom:-7px;right:28px;width:10px;border-radius:2px;background:linear-gradient(90deg,#39434B,#4E5A63 40%,#333C43);opacity:.9;box-shadow:0 0 8px rgba(58,55,51,.35)}
.signet{position:absolute;bottom:-32px;left:46px;width:15px;height:42px;background:var(--sumi);opacity:.9;clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%)}
.couv-sur{font-family:var(--f-disp);font-weight:500;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--encre-pale)}
.couv-logo{width:min(206px,58vw);height:auto;margin:16px 0 14px;filter:drop-shadow(0 6px 12px rgba(58,55,51,.22))}
.couv-titre{font-family:var(--f-hand);font-size:32px;line-height:1;color:var(--encre)}
.couv-dates{font-family:var(--f-disp);font-weight:500;font-size:12.5px;letter-spacing:.1em;color:var(--encre-pale);margin-top:9px}
.couv-compte{font-family:var(--f-hand);font-size:22px;color:var(--sumi);margin-top:2px}
.couv-ouvrir{font-family:var(--f-disp);font-weight:500;margin-top:auto;padding-top:22px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--encre-pale)}
.couv-ouvrir b{font-weight:400;border-bottom:1px solid var(--encre-pale);padding-bottom:2px}
@keyframes poser{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- téléphone ---------- */
@media (max-width:900px){
  body{padding:calc(12px + env(safe-area-inset-top)) 10px 92px}
  .carnet{grid-template-columns:1fr;gap:12px;padding-right:0;height:calc(100vh - 118px);height:calc(100dvh - 118px);min-height:0}
  .page{height:calc(100vh - 118px);height:calc(100dvh - 118px);min-height:0;box-shadow:0 10px 26px -16px rgba(58,55,51,.4)}
  .feuille{padding:18px 16px 26px}
  .rang-suite{display:flex;margin-top:26px;justify-content:center}
  .onglets{display:none}
  .etoile{display:none}
  .duo,.trio{grid-template-columns:1fr}
  .hanko{width:126px;height:126px}
  .hanko-in .n{font-size:48px}
  .livre{width:min(320px,86vw);padding:26px 20px}
  .couv-titre{font-size:29px}

  /* liste → fiche */
  .carnet[data-vue="fiche"] .page-g{display:none}
  .carnet[data-vue="liste"] .page-d{display:none}
  .carnet[data-vue="fiche"] .retour{display:flex}

  /* 16px minimum : sinon Safari zoome au focus */
  .champ,.coche .txt,.ligne-dep input,input,textarea,select{font-size:18.5px}
  .jp-mot{grid-template-columns:1fr;gap:0 0}
  .jp-mot i{margin-bottom:8px;display:block}
  .ligne-dep{grid-template-columns:1fr 84px 40px}

  /* zones de tap */
  .case{width:20px;height:20px}
  .case svg{width:13px;height:13px}
  .coche{padding:9px 0}
  .sup{font-size:21px;padding:10px 12px}
  .sup::after{inset:-4px}
  .btn{padding:11px 18px;font-size:15px}
  .crayon{padding:10px 6px;margin:-10px -6px}
  .carte{padding:15px 15px}
  .jour{padding:14px 6px}

  .barre-bas{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(245,240,227,.94);backdrop-filter:blur(10px);
    border-top:1px solid var(--papier-bord);
    padding:5px 4px calc(5px + env(safe-area-inset-bottom));
    justify-content:space-between;
  }
  .barre-bas button{
    flex:1;border:none;background:transparent;border-radius:10px;
    min-height:46px;padding:5px 2px;font-family:var(--f-disp);font-weight:500;font-size:10.5px;color:var(--encre-pale);line-height:1.25;
  }
  .barre-bas button b{display:block;font-size:18px;font-weight:400;margin-bottom:2px}
  .barre-bas button.on{color:var(--sumi);background:rgba(180,83,74,.08)}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.feuille{animation:paraitre .22s ease both}
@keyframes paraitre{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>

function fusion(base, sauve){
  for(const k in sauve){
    if(sauve[k] && typeof sauve[k]==='object' && !Array.isArray(sauve[k]) && base[k] && !Array.isArray(base[k])) base[k]=fusion(base[k],sauve[k]);
    else base[k]=sauve[k];
  }
  return base;
}

function lire(ch){ return ch.split('.').reduce((o,k)=> o==null?undefined:o[k], S); }
function ecrire(ch,v){ const p=ch.split('.'), d=p.pop(); p.reduce((o,k)=>o[k],S)[d]=v; }

/* ---------- dates ---------- */
const JOURS_FR=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const MOIS_FR=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const E = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function iso(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dateDe(s){ if(!s) return null; const d=new Date(s+'T12:00:00'); return isNaN(d)?null:d; }
function joursEntre(a,b){ return Math.round((dateDe(b)-dateDe(a))/86400000); }
const aujourdhui = () => iso(new Date());
function listeJours(){
  const a=dateDe(S.voyage.depart), b=dateDe(S.voyage.retour);
  if(!a||!b||b<a) return [];
  const n=Math.min(joursEntre(S.voyage.depart,S.voyage.retour),90);
  return Array.from({length:n+1},(_,i)=>{ const d=new Date(a); d.setDate(a.getDate()+i); return d; });
}
function enVoyage(){
  const a=S.voyage.depart, b=S.voyage.retour, h=aujourdhui();
  return !!(a&&b && joursEntre(a,h)>=0 && joursEntre(h,b)>=0);
}
function jourData(cle){ if(!S.jours[cle]) S.jours[cle]={titre:'',items:[],notes:''}; return S.jours[cle]; }
function periode(){
  const a=S.voyage.depart, b=S.voyage.retour;
  if(!a||!b) return 'dates à remplir';
  const da=dateDe(a), db=dateDe(b);
  if(da.getMonth()===db.getMonth()&&da.getFullYear()===db.getFullYear())
    return `${da.getDate()} → ${db.getDate()} ${MOIS_FR[db.getMonth()]} ${db.getFullYear()}`;
  return `${da.getDate()} ${MOIS_FR[da.getMonth()]} → ${db.getDate()} ${MOIS_FR[db.getMonth()]} ${db.getFullYear()}`;
}
function compteur(){
  const a=S.voyage.depart, b=S.voyage.retour;
  if(!a) return '';
  const n=joursEntre(aujourdhui(),a);
  if(n>1) return `encore ${n} jours`;
  if(n===1) return 'demain !';
  if(n===0) return 'c’est aujourd’hui';
  if(enVoyage()) return 'voyage en cours';
  return 'souvenirs';
}

function champ(ch,ph,type='text',cls=''){ return `<input class="champ ${cls}" type="${type}" data-lie="${ch}" value="${E(lire(ch)??'')}" placeholder="${E(ph)}">`; }
function zone(ch,ph){ return `<textarea class="champ" data-lie="${ch}" placeholder="${E(ph)}">${E(lire(ch)??'')}</textarea>`; }
function bloc(lbl,html){ return `<div><span class="lbl">${E(lbl)}</span>${html}</div>`; }

function aeroport(h){
  const [H,M]=h.split(':').map(Number);

}

function numSemaine(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  const a=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil((((t-a)/86400000)+1)/7);
}

        <div class="coche ${x.f?'fait':''}">
          <button class="case" role="checkbox" aria-checked="${x.f}" data-coche="valise.${i}.items.${k}" aria-label="Rangé"></button>
          <input class="txt" data-lie="valise.${i}.items.${k}.t" value="${E(x.t)}" placeholder="…">
          <button class="sup" data-act="suppr-valise" data-c="${i}" data-i="${k}" aria-label="Supprimer">×</button>
        </div>`).join('')||`<p class="mini">Catégorie vide.</p>`}</div>
      <div class="rang">
        <button class="btn" data-act="ajout-valise" data-c="${i}">+ Ajouter un objet</button>
        <button class="btn" data-act="suppr-cat" data-c="${i}">Supprimer la catégorie</button>
      </div>`;
  }
};

/* --- 5. Budget --- */
const CATS_DEP=['Transport','Hébergement','Repas','Visites','Achats','Autre'];
VUES.budget = {
  gauche(){
    const tot=S.depenses.reduce((a,d)=>a+(+d.yen||0),0);
    const prevu=+S.budgetPrevu||0;
    const pc=prevu?Math.min(100,Math.round(tot/prevu*100)):0;
    const parCat=CATS_DEP.map(c=>[c,S.depenses.filter(d=>d.cat===c).reduce((a,d)=>a+(+d.yen||0),0)]).filter(x=>x[1]>0);
    return enTete()+`<h2 class="titre">Dépensé</h2>
      <div class="somme"><span class="gros">¥ ${fmt(tot)}</span><span class="eur">≈ ${eur(tot)} €</span></div>
      ${prevu?`<div class="barre"><span style="width:${pc}%;background:${pc>90?'#B4534A':'#9FB264'}"></span></div>
        <p class="mini">${pc}% du budget prévu · reste ¥ ${fmt(Math.max(0,prevu-tot))} (${eur(Math.max(0,prevu-tot))} €)</p>`:''}
      <div class="duo" style="margin-top:16px">
        ${bloc('Budget prévu (¥)', champ('budgetPrevu','300000','number'))}
        ${bloc('1 ¥ vaut … €', champ('taux','0.0060'))}
      </div>
      <div class="regle"></div>
      <h2 class="titre">Par poste</h2>
      ${parCat.length?parCat.map(([c,v])=>`<div class="pot"><span>${E(c)}</span><span>¥ ${fmt(v)} <span class="mini">· ${eur(v)} €</span></span></div>`).join('')
        :`<p class="vide"><b>Rien de dépensé pour l’instant.</b>Les postes se remplissent au fur et à mesure que tu notes tes dépenses.</p>`}
      ${ETOILE.replace('class="etoile"','class="etoile" style="right:24px;bottom:22px;transform:rotate(-14deg)"')}`;
  },
  droite(){
    return barreRetour()+`<h2 class="titre">Le carnet de dépenses</h2>
      <div class="ligne-dep mini" style="border-bottom:1px solid #D3E0EA;padding-bottom:6px;margin-bottom:6px">
        <span>Quoi</span><span class="yen">Yens</span><span></span>
      </div>
      ${S.depenses.map((d,i)=>`
        <div class="ligne-dep">
          <input data-lie="depenses.${i}.label" value="${E(d.label)}" placeholder="ex. Shinkansen Tokyo–Kyoto">
          <input class="yen" data-lie="depenses.${i}.yen" value="${E(d.yen)}" inputmode="numeric" placeholder="0">
          <button class="sup" data-act="suppr-dep" data-i="${i}" aria-label="Supprimer">×</button>
          <select class="champ" data-lie="depenses.${i}.cat" style="grid-column:1/3;font-size:14.5px;color:#8A8478;border-bottom:none;padding:0 0 8px">
            ${CATS_DEP.map(c=>`<option ${d.cat===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>`).join('')||`<p class="vide"><b>Le carnet est vierge.</b>Note ici chaque dépense en yens, la conversion se fait à côté.</p>`}
      <div class="rang"><button class="btn btn-p" data-act="ajout-dep">+ Ajouter une dépense</button></div>`;
  }
};
const fmt = n => (Math.round(n)||0).toLocaleString('fr-FR');
const eur = n => (n*(parseFloat(String(S.taux).replace(',','.'))||0.006)).toLocaleString('fr-FR',{maximumFractionDigits:0});

/* --- 6. Infos --- */
VUES.infos = {
  gauche(){
    return enTete()+`<h2 class="titre">Bon à savoir</h2>`+
      FICHES.map(f=>{
        const on=S.infoEdit===f.cle;
        return `<div class="bloc ${f.rouge?'bloc-r':''}">
          <h4>${E(f.t)}<button class="crayon" data-act="editer" data-cle="${f.cle}">${on?'Terminé':'Modifier'}</button></h4>
          ${on?zone(`infos.${f.cle}`,'une ligne par idée'):para(S.infos[f.cle])}
        </div>`;
      }).join('');
  },
  droite(){
    return barreRetour()+`<h2 class="titre">Quelques mots</h2>
      <div class="jp-mot">${S.motsJP.map(([fr,jp])=>`<span>${E(fr)}</span><i>${E(jp)}</i>`).join('')}</div>
      <div class="regle regle-b"></div>
      <h2 class="titre">Tout le reste</h2>
      ${zone('infos.notes','adresses de restos, conseils d’amis, liens…')}`;
  }
};

/* =======================================================
   RENDU
   ======================================================= */
function rendre(){
  const sec=SECTIONS.find(s=>s.id===S.section)||SECTIONS[0];
  document.getElementById('carnet').dataset.vue = S.vue;
  const suite = sec.suite ? `<div class="rang rang-suite"><button class="btn btn-p" data-act="suite">${E(sec.suite)} →</button></div>` : '';
  document.getElementById('pg').innerHTML = VUES[sec.id].gauche()+suite;
  document.getElementById('pd').innerHTML = VUES[sec.id].droite();
  onglets(); barreBas();
  for(const el of document.querySelectorAll('.feuille')){ el.style.animation='none'; void el.offsetWidth; el.style.animation=''; }
}
function rendreGauche(){ document.getElementById('pg').innerHTML = VUES[S.section].gauche(); }
function onglets(){
  document.getElementById('onglets').innerHTML = SECTIONS.map(s=>
    `<button class="onglet ${s.id===S.section?'on':''}" data-sec="${s.id}"><b>${s.ico}</b>${E(s.nom)}</button>`).join('');
}
function barreBas(){
  document.getElementById('barreBas').innerHTML = SECTIONS.map(s=>
    `<button class="${s.id===S.section?'on':''}" data-sec="${s.id}"><b>${s.ico}</b>${E(s.nom)}</button>`).join('');
}
function majCouverture(){
  const t=document.getElementById('couvTitre'); if(!t) return;
  t.textContent = S.voyage.titre||'Japon';
  document.getElementById('couvDates').textContent = periode();
  document.getElementById('couvCompte').textContent = compteur();
  const o=document.getElementById('couvOuvrir');
  o.textContent = enVoyage() ? `Ouvrir · jour ${joursEntre(S.voyage.depart,aujourdhui())+1}` : 'Ouvrir';
}
function hautDePage(){
  window.scrollTo(0,0);
  for(const el of document.querySelectorAll('.feuille')) el.scrollTop = 0;
}
function allerAujourdhui(){
  if(!enVoyage()) return;
  S.section='itineraire'; S.jourActif=aujourdhui(); S.vue='fiche';
  sauver(); rendre(); hautDePage();
}

/* =======================================================
   INTERACTIONS
   ======================================================= */
document.addEventListener('input', e=>{
  const t=e.target;
  if(!t.dataset.lie) return;
  let v=t.value;
  if(t.type==='number') v = v===''?'':+v;
  ecrire(t.dataset.lie,v); sauver(); majDouce(t.dataset.lie);
});
function majDouce(ch){
  const s=S.section;
  if(s==='budget'&&(ch.startsWith('depenses')||ch==='taux'||ch==='budgetPrevu')) rendreGauche();
  if(s==='voyage'&&(ch==='voyage.depart'||ch==='voyage.retour')) rendreGauche();
  if(s==='itineraire'&&ch.endsWith('.titre')) rendreGauche();
  if(s==='hotels'&&(ch.endsWith('.nom')||ch.endsWith('.ville'))) rendreGauche();
  if(s==='valise'&&ch.endsWith('.cat')) rendreGauche();
  if(ch.startsWith('voyage.')) majCouverture();
}

document.addEventListener('click', e=>{
  const b=e.target.closest('button, a');
  if(!b) return;

  if(b.dataset.sec){ S.section=b.dataset.sec; S.vue='liste'; S.infoEdit=null; sauver(); rendre(); hautDePage(); return; }
  if(b.dataset.coche){
    const o=lire(b.dataset.coche); o.f=!o.f; sauver();
    b.setAttribute('aria-checked',o.f);
    b.closest('.coche').classList.toggle('fait',o.f);
    if(S.section==='itineraire'||S.section==='valise') rendreGauche();
    return;
  }
  if(b.dataset.jour){ S.jourActif=b.dataset.jour; S.vue='fiche'; sauver(); rendre(); hautDePage(); return; }
  if(b.dataset.hotel){ S.hotelActif=+b.dataset.hotel; S.vue='fiche'; sauver(); rendre(); hautDePage(); return; }
  if(b.dataset.valise){ S.valiseActive=+b.dataset.valise; S.vue='fiche'; sauver(); rendre(); hautDePage(); return; }

  const a=b.dataset.act;
  if(!a) return;
  if(a==='retour'){ S.vue='liste'; sauver(); rendre(); hautDePage(); return; }
  if(a==='suite'){ S.vue='fiche'; sauver(); rendre(); hautDePage(); return; }
  if(a==='aujourdhui'){ allerAujourdhui(); return; }
  if(a==='editer'){
    S.infoEdit = S.infoEdit===b.dataset.cle ? null : b.dataset.cle;
    rendre();
    const z=document.querySelector('#pg textarea[data-lie]'); if(z) z.focus();
    return;
  }
  if(a==='ajout-hotel'){ S.hotels.push({nom:'',ville:'',quartier:'',adresse:'',arrivee:'',depart:'',checkin:'15:00',checkout:'10:00',prix:'',ref:'',tel:'',lien:'',notes:''}); S.hotelActif=S.hotels.length-1; S.vue='fiche'; }
  if(a==='suppr-hotel'){ if(!confirm('Supprimer cet hébergement ?')) return; S.hotels.splice(+b.dataset.i,1); S.hotelActif=Math.max(0,S.hotelActif-1); S.vue='liste'; }
  if(a==='ajout-item'){ jourData(b.dataset.cle).items.push({t:'',f:false}); }
  if(a==='suppr-item'){ jourData(b.dataset.cle).items.splice(+b.dataset.i,1); }
  if(a==='ajout-cat'){ S.valise.push({cat:'Nouvelle catégorie',items:[]}); S.valiseActive=S.valise.length-1; S.vue='fiche'; }
  if(a==='suppr-cat'){ if(!confirm('Supprimer la catégorie et son contenu ?')) return; S.valise.splice(+b.dataset.c,1); S.valiseActive=0; S.vue='liste'; }
  if(a==='ajout-valise'){ S.valise[+b.dataset.c].items.push({t:'',f:false}); }
  if(a==='suppr-valise'){ S.valise[+b.dataset.c].items.splice(+b.dataset.i,1); }
  if(a==='ajout-dep'){ S.depenses.push({label:'',yen:'',cat:'Repas'}); }
  if(a==='suppr-dep'){ S.depenses.splice(+b.dataset.i,1); }
  sauver(); rendre();
  if(a==='ajout-item'||a==='ajout-valise'||a==='ajout-dep'){
    const champs=[...document.querySelectorAll('#pd input[data-lie]')].filter(c=>c.type==='text');
    const der = a==='ajout-dep' ? champs[champs.length-2] : champs[champs.length-1];
    if(der){ der.focus(); der.scrollIntoView({block:'center'}); }
  }
});

document.addEventListener('keydown', e=>{
  if(e.key===' '&&e.target.classList.contains('case')){ e.preventDefault(); e.target.click(); }
  if(e.key==='Enter'&&e.target.classList.contains('txt')){
    e.preventDefault();
    const btn=document.querySelector('#pd [data-act^="ajout-"]'); if(btn) btn.click();
  }
});

/* ---------- gestes ---------- */
let gx=0, gy=0, gt=0, gok=false;
const carnet=document.getElementById('carnet');
carnet.addEventListener('touchstart', e=>{
  if(e.touches.length!==1||e.target.closest('input,textarea,select')){ gok=false; return; }
  gok=true; gx=e.touches[0].clientX; gy=e.touches[0].clientY; gt=Date.now();
},{passive:true});
carnet.addEventListener('touchend', e=>{
  if(!gok||window.innerWidth>900) return;
  const dx=e.changedTouches[0].clientX-gx, dy=e.changedTouches[0].clientY-gy;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*2||Date.now()-gt>600) return;
  glisser(dx<0?1:-1);
},{passive:true});

function glisser(sens){
  const sec=SECTIONS.find(s=>s.id===S.section);
  if(sec.items && S.vue==='fiche'){
    if(S.section==='itineraire'){
      const js=listeJours().map(iso);
      const i=js.indexOf(S.jourActif)+sens;
      if(i<0||i>=js.length) return;
      S.jourActif=js[i];
    } else if(S.section==='hotels'){
      const i=S.hotelActif+sens; if(i<0||i>=S.hotels.length) return; S.hotelActif=i;
    } else {
      const i=S.valiseActive+sens; if(i<0||i>=S.valise.length) return; S.valiseActive=i;
    }
  } else {
    const i=SECTIONS.findIndex(s=>s.id===S.section)+sens;
    if(i<0||i>=SECTIONS.length) return;
    S.section=SECTIONS[i].id; S.vue='liste'; S.infoEdit=null;
  }
  sauver(); rendre(); hautDePage();
}

/* ---------- couverture ---------- */
document.getElementById('livre').addEventListener('click', ()=>{
  if(enVoyage()){ S.section='itineraire'; S.jourActif=aujourdhui(); S.vue='fiche'; }
  document.body.classList.add('ouvert');
  sauver(); rendre(); hautDePage();
});
document.getElementById('fermer').addEventListener('click', ()=>{
  majCouverture(); document.body.classList.remove('ouvert'); hautDePage();
});

/* ---------- sauvegarde ---------- */
document.getElementById('exporter').addEventListener('click', async ()=>{
  const nom=`carnet-japon-${aujourdhui()}.json`;
  const txt=JSON.stringify(S,null,2);
  try{
    const f=new File([txt],nom,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:nom}); return; }
  }catch(err){ if(err&&err.name==='AbortError') return; }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
  a.download=nom; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
document.getElementById('importer').addEventListener('click', ()=> document.getElementById('fichier').click());
document.getElementById('fichier').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      S=fusion(structuredClone(DEFAUT),JSON.parse(r.result));
      S.vue='liste'; S.infoEdit=null;
      localStorage.setItem(CLE,JSON.stringify(S));
      majCouverture(); rendre();
    }catch(err){ alert("Ce fichier n’est pas une sauvegarde du carnet."); }
  };
  r.readAsText(f);
});

/* ---------- manifeste + hors-ligne ---------- */
const manifeste={
  name:"Carnet de voyage · Japon", short_name:"Carnet Japon",
  start_url:"./", scope:"./", display:"standalone",
  background_color:"#D8D1C3", theme_color:"#D8D1C3", lang:"fr",
  icons:[{src:document.querySelector('link[rel="apple-touch-icon"]').href, sizes:"180x180", type:"image/png", purpose:"any"}]
};
const lienM=document.createElement('link');
lienM.rel='manifest';
lienM.href=URL.createObjectURL(new Blob([JSON.stringify(manifeste)],{type:'application/manifest+json'}));
document.head.appendChild(lienM);

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

majCouverture();
rendre();
</script>
</body>
</html>
